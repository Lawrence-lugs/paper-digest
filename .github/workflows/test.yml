name: Run unit tests

on:
  push:
    branches: [main, web-frontend]
  pull_request:
    branches: [main, web-frontend]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run unit tests (ingest, pipeline, app)
        run: node --test "test/ingest/*.js" "test/pipeline/*.js" "test/app/*.js"

      - name: Syntax check
        run: npm run lint
