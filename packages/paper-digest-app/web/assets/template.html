<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digest: {{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'}};</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
{{SCHOLARLY_READER_JS}}
</head>
<body>
<div class="sr-root">
<div class="sr-grid">
<nav class="sr-toc" aria-label="Table of contents">
{{NAV_LINKS}}
</nav>
<main class="sr-page">
<div class="sr-main">
<header class="sr-header">
{{SOURCE_OPEN}}<p class="sr-kicker" style="color:var(--sr-mute)">{{VENUE}} &middot; {{ID}} &middot; read: {{WHAT_READ}}</p>{{SOURCE_CLOSE}}
<h1 class="sr-title">{{TITLE}}</h1>
<p class="sr-authors">{{AUTHORS}}</p>
<p class="sr-verdict"><b>Verdict.</b> {{VERDICT}} <span class="sr-badge sr-tone-accent">{{OVERALL_CONF}}%</span></p>
</header>

{{SECTIONS}}

</div>
</main>
</div>
<script>
const BASE = "{{BASE}}";
const MAP = {{MAP}};
document.querySelectorAll('figure[data-n]').forEach((f)=>{
  f.classList.add('sr-figure');
  if (f.querySelector('img, svg')) return;
  const n=f.dataset.n,img=new Image();img.loading='lazy';img.alt='Figure '+n;
  img.onerror=()=>{const a=document.createElement('a');a.href=BASE.replace(/\/$/,'')+'#'+f.dataset.a;a.textContent='Open Fig. '+n+' on arXiv';a.className='sr-toc-link';a.style.color='var(--sr-teal)';img.replaceWith(a);};
  img.src=MAP[n] ? new URL(MAP[n], BASE || window.location.origin).href : "";
  f.prepend(img);
});
</script>
<script>
/* Initialize scholarly-reader layout (ToC scroll-spy, drawer) and reading marker.
   Runs after MathJax has typeset. */
addEventListener('load', () => {
  const p = window.MathJax && window.MathJax.startup && window.MathJax.startup.promise;
  Promise.resolve(p).then(() => {
    const root = document.querySelector('.sr-root');
    if (!root) return;

    // Wire up ToC: scroll-spy, permanent floating ToC (forceWide like CSR), smooth scroll
    if (window.ScholarlyReader && window.ScholarlyReader.mountLayout) {
      window.ScholarlyReader.mountLayout(root, { forceWide: true });
    }

    // Wire up reading marker: R toggles, arrows/j/k navigate, click on unit, Esc exits
    const main = root.querySelector('.sr-main');
    if (main && window.ScholarlyReader && window.ScholarlyReader.createReadingMark) {
      const readingMark = window.ScholarlyReader.createReadingMark({ container: main });
      readingMark.attach();
    }

    // Initialize theme selector (floating button + dropdown)
    if (window.ScholarlyReader && window.ScholarlyReader.attachThemeSelector) {
      window.ScholarlyReader.attachThemeSelector(document, { position: 'bottom-right' });
    }
  });
});
</script>
</body>
</html>
