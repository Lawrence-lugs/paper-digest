<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — Paper Digest</title>
<script src="https://cdn.tailwindcss.com"></script>
<script id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  /* Body measure tuned so inline math stays inline, only display equations scroll. */
  .prose-body { max-width: 72ch; }
  .conf { font-size: 0.75em; opacity: 0.7; margin-left: 0.5em; }
  .chip { display: inline-block; padding: 0.05em 0.4em; border-radius: 0.35em;
          font-size: 0.75em; margin-left: 0.35em; }
  .chip.pos { background: #e7f7ec; color: #166534; }
  .chip.neg { background: #fdecea; color: #991b1b; }
  .chip.neu { background: #f1f5f9; color: #334155; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #cbd5e1; padding: 0.4em 0.6em; text-align: left; font-size: 0.9em; }
  th { background: #f8fafc; }
  .wrap { overflow-x: auto; margin: 1em 0; }
  figure { margin: 1em 0; text-align: center; }
  figure img { max-width: 100%; height: auto; border: 1px solid #e2e8f0; }
  figcaption { font-size: 0.85em; color: #475569; margin-top: 0.4em; }
  .cite { font-size: 0.8em; color: #64748b; margin-top: 0.2em; }
  .ui { color: #475569; }
  .b li { margin: 0.25em 0; }
  .s { margin-top: 1.2em; }
  nav { position: sticky; top: 0; background: #ffffffdd; backdrop-filter: blur(4px);
        border-bottom: 1px solid #e2e8f0; z-index: 20; }
  nav a { display: block; padding: 0.4em 0.8em; font-size: 0.85em; color: #475569; }
  nav a:hover { background: #f1f5f9; color: #1e293b; }
  /* Reading marker states */
  .rd { cursor: pointer; }
  .rd.active { background: #3b82f6; color: #fff; border-radius: 0.2em; }
  #rd-hint { position: fixed; bottom: 1em; right: 1em; background: #0f172a; color: #fff;
             padding: 0.4em 0.8em; border-radius: 0.4em; font-size: 0.8em; opacity: 0;
             transition: opacity 0.2s; z-index: 50; pointer-events: none; }
  #rd-hint.visible { opacity: 0.9; }
</style>
</head>
<body class="antialiased bg-slate-50 text-slate-900">
<nav class="px-4 py-2 hidden md:flex gap-2 overflow-x-auto">
  {{NAV_LINKS}}
</nav>

<article class="prose-body mx-auto p-6 md:p-10 space-y-6">
  <header>
    <h1 class="text-2xl font-bold tracking-tight">{{TITLE}}</h1>
    <p class="text-slate-600 text-sm mt-1">{{AUTHORS}} — {{VENUE}} ({{ID}})</p>
    <p class="text-slate-600 text-sm mt-2"><span class="font-semibold">Read:</span> {{WHAT_READ}}</p>
    <div class="mt-3 p-3 rounded bg-blue-50 border border-blue-100">
      <p class="text-sm text-slate-700">{{VERDICT}}</p>
      <p class="text-xs text-slate-500 mt-1"><span class="font-semibold">Overall confidence:</span> {{OVERALL_CONF}}%</p>
    </div>
  </header>

  {{SECTIONS}}

  <section id="src" class="mt-8 pt-6 border-t border-slate-200">
    <h2 class="s" id="src">Sources and limits<span class="conf">{{SRC_CONF}}%</span></h2>
    <p class="text-sm text-slate-600">{{SRC_CONTENT}}</p>
    {{CITATIONS}}
  </section>
</article>

<script>
// Figure + image pipeline. BASE is the arXiv HTML version actually read;
// MAP maps figure number -> file name (src). Images are loaded from BASE + MAP[n]
// and fall back to an "Open on arXiv" link if they fail.
const BASE = "{{BASE}}";
const MAP = {{MAP}};

window.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll("figure[data-n]").forEach((fig) => {
    const n = fig.getAttribute("data-n");
    const file = MAP && MAP[n];
    const img = fig.querySelector("img");
    if (!img && file) {
      const a = document.createElement("a");
      a.href = new URL(file, BASE).href;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "Open figure on arXiv";
      a.className = "ui";
      fig.appendChild(a);
    }
  });
  imgFallbacks();
});

function imgFallbacks() {
  document.querySelectorAll("figure img").forEach((img) => {
    img.addEventListener("error", () => {
      const fig = img.closest("figure");
      const n = fig ? fig.getAttribute("data-n") : null;
      const file = n && MAP && MAP[n];
      const url = file ? new URL(file, BASE).href : img.src;
      const a = document.createElement("a");
      a.href = url; a.target = "_blank"; a.rel = "noopener";
      a.textContent = "Open figure on arXiv";
      a.className = "ui block mt-2";
      img.replaceWith(a);
    });
  });
}

/* ---------- Reading marker ---------- */
const ABBREVS = ["e.g","i.e","etc","vs","fig","Fig","et al","al","No","no","p","pp","sec","Sec","ch","Ch","vol","Vol","pp"];
function isAbbrEnd(text, pos) {
  const before = text.slice(Math.max(0, pos - 6), pos + 1).trim();
  return ABBREVS.some((a) => before.toLowerCase().endsWith(a.toLowerCase() + "."));
}
function splitSentences(node) {
  if (node.nodeType === Node.TEXT_NODE) {
    const text = node.textContent;
    if (!text.trim()) return;
    const parts = [];
    let idx = 0;
    const re = /([.!?]+)(\s|$)/g;
    let m;
    let last = 0;
    while ((m = re.exec(text)) !== null) {
      const end = m.index + m[1].length;
      if (isAbbrEnd(text, end - 1)) continue;
      parts.push(text.slice(last, end));
      last = end;
    }
    if (last < text.length) parts.push(text.slice(last));
    if (parts.length === 1 && parts[0] === text) return; // no split
    const frag = document.createDocumentFragment();
    parts.forEach((p) => {
      const span = document.createElement("span");
      span.className = "rd";
      span.textContent = p;
      span.addEventListener("click", () => moveTo(span));
      frag.appendChild(span);
    });
    node.parentNode.replaceChild(frag, node);
    return;
  }
  if (node.nodeType !== Node.ELEMENT_NODE) return;
  const tag = node.tagName;
  if (tag === "MATH" || tag === "SCRIPT" || tag === "STYLE" || tag === "TEXTAREA") return;
  const isStop = tag === "DISPLAY" || tag === "DIV" && node.classList.contains("rd-stop");
  const childs = Array.from(node.childNodes);
  let splitThis = false;
  if (["P","LI","BLOCKQUOTE","FIGCAPTION","TD","TH","ITEM"].includes(tag) ||
      node.classList.contains("item")) {
    splitThis = true;
  }
  if (splitThis && !isStop) {
    // only split direct text-node runs; nested blocks handled recursively
    let textOnly = true;
    childs.forEach((c) => { if (c.nodeType === Node.ELEMENT_NODE) textOnly = false; });
    if (textOnly) {
      splitSentences(node.firstChild); // handled by recursion on text nodes via wrapper below
    }
  }
  childs.forEach(splitSentences);
}

function wrapSentences(root) {
  // wrap direct text children of eligible blocks into .rd spans
  const blocks = root.querySelectorAll("p, li, blockquote, figcaption, td, th, .item");
  blocks.forEach((blk) => {
    const kids = Array.from(blk.childNodes);
    kids.forEach((kid) => {
      if (kid.nodeType === Node.TEXT_NODE && kid.textContent.trim()) {
        splitSentences(kid);
      } else if (kid.nodeType === Node.ELEMENT_NODE) {
        // recurse into nested eligible blocks but don't double-wrap
        wrapSentences(kid);
      }
    });
  });
}

let current = null;
function moveTo(span) {
  if (current) current.classList.remove("active");
  current = span;
  if (!current) return;
  current.classList.add("active");
  current.scrollIntoView({ behavior: "smooth", block: "center" });
  showHint();
}
function showHint() {
  const h = document.getElementById("rd-hint");
  if (!h) return;
  h.classList.add("visible");
}
function clearMarker() {
  if (current) current.classList.remove("active");
  current = null;
  const h = document.getElementById("rd-hint");
  if (h) h.classList.remove("visible");
}

window.addEventListener("DOMContentLoaded", () => {
  const root = document.body;
  // hint element
  const h = document.createElement("div");
  h.id = "rd-hint";
  h.textContent = "Reading marker active — ↓/↑ or j/k move, click a sentence, Esc or R to stop";
  root.appendChild(h);
  // allow MathJax to finish, then wrap sentences
  window.MathJax ? MathJax.typesetPromise().then(() => wrapSentences(root)) : wrapSentences(root);
});
let armed = false;
window.addEventListener("keydown", (e) => {
  if (e.key === "r" || e.key === "R") {
    if (current) { clearMarker(); return; }
    const spans = document.querySelectorAll(".rd");
    if (spans.length) { moveTo(spans[0]); }
    return;
  }
  if (!current) return;
  if (e.key === "Escape" || e.key === "Esc") { clearMarker(); return; }
  const spans = Array.from(document.querySelectorAll(".rd"));
  const i = spans.indexOf(current);
  if (i === -1) return;
  let next = i;
  if (e.key === "ArrowDown" || e.key === "j") next = i + 1;
  if (e.key === "ArrowUp" || e.key === "k") next = i - 1;
  if (e.key === "ArrowDown" || e.key === "ArrowUp" || e.key === "j" || e.key === "k") {
    e.preventDefault();
    if (next >= 0 && next < spans.length) moveTo(spans[next]);
  }
});
</script>
</body>
</html>
